    <!-- Meta Conversions API (CAPI) Client-Side Bridge & Deduplication -->
    <script>
      (function() {
        // Parse cookie helper
        function getCookie(name) {
          var match = document.cookie.match(new RegExp('(^|;\\s*)(' + name + ')=([^;]*)'));
          return match ? decodeURIComponent(match[3]) : null;
        }

        // Get or build fbc from fbclid query parameter
        function getFbc() {
          var cookieFbc = getCookie('_fbc');
          if (cookieFbc) return cookieFbc;
          try {
            var params = new URLSearchParams(window.location.search);
            var fbclid = params.get('fbclid');
            if (fbclid) {
              return 'sub.1.' + Date.now() + '.' + fbclid;
            }
          } catch(e) {}
          return null;
        }

        // Store user input as they fill the form for CAPI matching
        window.__capiUserData = {
          em: null,
          ph: null,
          fn: null,
          ct: null
        };

        // Listen for form inputs to enrich CAPI events
        document.addEventListener('input', function(e) {
          var target = e.target;
          if (!target || !target.name) return;
          var name = target.name.toLowerCase();
          var val = target.value;
          if (!val) return;

          if (name.includes('email')) {
            window.__capiUserData.em = val;
          } else if (name.includes('phone') || name.includes('whatsapp') || name.includes('tel')) {
            window.__capiUserData.ph = val;
          } else if (name.includes('name') || name.includes('fullname')) {
            window.__capiUserData.fn = val;
          } else if (name.includes('city') || name.includes('state') || name.includes('address')) {
            window.__capiUserData.ct = val;
          }

          // TikTok Advanced Matching
          if (window.ttq && typeof window.ttq.identify === 'function') {
            try {
              var ttIdentify = {};
              if (window.__capiUserData.em) ttIdentify.email = window.__capiUserData.em;
              if (window.__capiUserData.ph) ttIdentify.phone_number = window.__capiUserData.ph;
              if (Object.keys(ttIdentify).length > 0) {
                window.ttq.identify(ttIdentify);
              }
            } catch(e) {}
          }
        }, true);

        // Core CAPI dispatcher
        window.dispatchMetaCapiEvent = function(eventName, customData, eventId) {
          eventId = eventId || ('capi_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8));
          var payload = {
            event_name: eventName,
            event_id: eventId,
            event_source_url: window.location.href,
            custom_data: customData || {},
            user_data: {
              fbp: getCookie('_fbp'),
              fbc: getFbc(),
              em: window.__capiUserData.em,
              ph: window.__capiUserData.ph,
              fn: window.__capiUserData.fn,
              ct: window.__capiUserData.ct
            }
          };

          try {
            fetch('/api/meta-conversions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }).then(function(res) {
              return res.json();
            }).then(function(data) {
              console.log('[Meta CAPI Log]', eventName, '->', data);
            }).catch(function(err) {
              console.debug('[Meta CAPI Network Log]', err);
            });
          } catch (err) {
            console.debug('[Meta CAPI Dispatch Error]', err);
          }

          return eventId;
        };

        // Hook window.fbq to automatically forward all track calls to CAPI with shared eventID for deduplication
        var originalFbq = window.fbq;
        if (originalFbq) {
          window.fbq = function() {
            var args = Array.prototype.slice.call(arguments);
            var action = args[0];
            var eventName = args[1];
            var eventData = args[2] || {};
            var options = args[3] || {};

            if (action === 'track' && typeof eventName === 'string') {
              // Ensure an eventID exists for deduplication between Pixel & CAPI
              if (!options.eventID) {
                options.eventID = 'ev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
              }
              args[3] = options;

              // Fire server-side Conversions API in parallel
              window.dispatchMetaCapiEvent(eventName, eventData, options.eventID);
            }

            return originalFbq.apply(window, args);
          };

          // Preserve fbq properties
          for (var key in originalFbq) {
            if (Object.prototype.hasOwnProperty.call(originalFbq, key)) {
              window.fbq[key] = originalFbq[key];
            }
          }
        }

        // Fire initial PageView to CAPI
        window.dispatchMetaCapiEvent('PageView');
      })();
